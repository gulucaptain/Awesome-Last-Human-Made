  - id: "007"
    slug: code
    name: Hand-Written Code
    name_zh: 手写的代码
    since_year: 1843
    since: "1843"
    origin: "in Ada Lovelace’s Note G"
    origin_zh: "生于阿达·洛芙莱斯的“注释 G”"
