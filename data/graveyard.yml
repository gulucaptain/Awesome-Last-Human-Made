tombstones:
  - id: "001"
    slug: paper
    name: The Research Paper
    name_zh: 论文
    since_year: 1665
    since: "1665"
    origin: "with the first issue of *Philosophical Transactions*"
    origin_zh: "随《哲学汇刊》创刊而生"
    status: declared
    by: The Last Human-Written Paper
    by_zh: The Last Human-Written Paper
    successor: Agent-native research artifacts
    successor_zh: 面向智能体的研究制品
    epitaph: It held three centuries of science in eight pages, and left out every failed experiment.
    epitaph_zh: 它把三百年的科学装进八页纸，却删去了每一次失败的实验。
    entries:
      - title: "The Last Human-Written Paper: Agent-Native Research Artifacts"
        url: https://arxiv.org/abs/2604.24658
        kinds: [Manifesto, Protocol]
        date: "2026-04"
        note: Replaces the narrative PDF with an executable research package that keeps dead ends, design decisions and full implementation detail.
        note_zh: 用可执行的研究包取代叙事式 PDF，保留死胡同、设计决策和完整实现细节。
        links: {code: https://github.com/ARA-Labs/Agent-Native-Research-Artifact, template: https://github.com/Orchestra-Research/Agent-Native-Research-Artifact-template, demo: https://github.com/ARA-Labs/ARA-Demo}
      - title: The AI Scientist-v2
        url: https://www.nature.com/articles/s41586-026-10265-5
        kinds: [Demo]
        date: "2026"
        note: Its fully AI-generated paper passed peer review at an ICLR 2025 workshop; the system itself was published in Nature.
        note_zh: 它完全由 AI 生成的论文通过了 ICLR 2025 研讨会的同行评审，系统本身发表在 Nature。
        links: {x: https://x.com/SakanaAILabs/status/2036840833690071450}
      - title: Agents4Science 2025
        url: https://agents4science.stanford.edu
        kinds: [Demo]
        date: "2025-10"
        note: The first conference where AI systems are both the primary authors and the reviewers.
        note_zh: 第一个由 AI 系统同时担任第一作者和审稿人的会议。
        links: {report: https://arxiv.org/abs/2511.15534, x: https://x.com/james_y_zou/status/2001331557643276613}
      - title: paper.json
        url: https://arxiv.org/abs/2605.16194
        kinds: [Protocol]
        date: "2026-05"
        note: A companion file that travels with the PDF, giving every claim a stable ID and an explicit “does-not-claim” list for agent readers.
        note_zh: 随 PDF 一起分发的伴随文件，为每条主张分配稳定 ID，并为智能体读者列出“不主张”清单。
        links: {code: https://github.com/arquicanedo/paper-json}
      - title: Agentic Publication Protocol (APP)
        url: https://arxiv.org/abs/2606.27386
        kinds: [Protocol]
        date: "2026-06"
        note: Ships a paper as a repository release, with code, data, environment and an agent-facing instruction file.
        note_zh: 把论文作为一次仓库发布，附带代码、数据、环境和面向智能体的说明文件。
      - title: "Traxia: Verifiable, Agent-Native Scientific Publishing"
        url: https://arxiv.org/abs/2606.08256
        kinds: [Protocol]
        date: "2026-06"
      - title: "Knows: Agent-Native Structured Research Representations"
        url: https://arxiv.org/abs/2604.17309
        kinds: [Protocol]
        date: "2026-04"
      - title: "Rethinking Publication: A Certification Framework for AI-Enabled Research"
        url: https://arxiv.org/abs/2604.22026
        kinds: [Protocol]
        date: "2026-04"
        note: Separates judging the knowledge from grading the human contribution, so pipeline-generated work can be published consistently.
        note_zh: 把“评判知识”与“评定人类贡献”分开，让流水线生成的研究也能被一致地发表。
      - title: The Scientific Paper as a Human Artifact
        url: https://www.preprints.org/manuscript/202609.2371
        kinds: [Critique]
        date: "2026-09"
        note: The paper is not obsolete, but its monopoly is ending; its human-facing functions must be kept on purpose.
        note_zh: 论文并未过时，但它的垄断正在结束；它面向人的功能需要被有意保留。
      - title: Should Researchers Write Papers for AI Instead of People?
        source: IEEE Spectrum
        url: https://spectrum.ieee.org/ai-scientist-research-paper-format
        kinds: [Commentary]
        date: "2026"
      - title: Again, the research paper format will be dying out
        source: Marginal Revolution
        url: https://marginalrevolution.com/marginalrevolution/2026/06/again-the-paper-format-will-be-dying-out.html
        kinds: [Commentary]
        date: "2026-06"
      - title: The Last Human-Written Paper
        source: Towards AI
        url: https://pub.towardsai.net/the-last-human-written-paper-a14d29470ff7
        kinds: [Critique]
        date: "2026"
        note: Calls the title an overclaim; the approach mainly fits code-based research.
        note_zh: 认为标题言过其实，这一方案主要适用于以代码为主的研究。

  - id: "002"
    slug: peer-review
    name: Peer Review
    name_zh: 同行评审
    since_year: 1731
    since: "1731"
    origin: "with the refereed *Medical Essays* of the Royal Society of Edinburgh"
    origin_zh: "随爱丁堡皇家学会经同行审阅的《医学论文集》而生"
    status: alive
    by: AI review at conference scale
    by_zh: 会议规模的 AI 审稿
    successor: Defended by the ML community itself
    successor_zh: 由机器学习社区自己守护
    epitaph: Still reading the paper. Still asking for one more ablation.
    epitaph_zh: 还在读这篇论文，还在要求再补一个消融实验。
    entries:
      - title: AAAI-26 AI Review Pilot
        url: https://arxiv.org/abs/2604.13940
        kinds: [Demo]
        date: "2026-04"
        note: AI-written reviews for every submission at under $1 per paper; respondents preferred them on technical accuracy.
        note_zh: 为每篇投稿生成 AI 审稿意见，每篇成本不到 1 美元；受访者在技术准确性上更偏好 AI 审稿。
      - title: "Position: Stop Automating Peer Review Without Rigorous Evaluation"
        source: ICML 2026
        url: https://proceedings.mlr.press/v306/baumann26a.html
        kinds: [Critique]
        date: "2026"

  - id: "003"
    slug: proof
    name: The Written Proof
    name_zh: 手写的证明
    since_year: -300
    since: "c. 300 BC"
    origin: "in Euclid’s *Elements*"
    origin_zh: "生于欧几里得的《几何原本》"
    status: alive
    by: Agents writing machine-checked proofs
    by_zh: 写出机器可验证证明的智能体
    successor: Lean as the arbiter
    successor_zh: 由 Lean 来裁决
    epitaph: Fermat’s margin was too small. The machine’s was not.
    epitaph_zh: 费马的页边太窄，机器的没有。
    entries:
      - title: Fermat’s Last Theorem in Lean 4
        url: https://github.com/anthropics/fermats-last-theorem
        kinds: [Demo]
        date: "2026"
        note: A complete machine-checked proof; the Lean sources were produced by AI agents building on human-written open-source Lean.
        note_zh: 完整的机器验证证明；Lean 源码由 AI 智能体在人类编写的开源 Lean 基础上生成。
        links: {blog: https://www.anthropic.com/research/formalizing-fermats-last-theorem, x: https://x.com/AnthropicAI/status/2095947707605266436}
      - title: Advancing Mathematics Research with AI-Driven Formal Proof Search
        url: https://arxiv.org/abs/2605.22763
        kinds: [Demo]
        date: "2026-05"
        note: An agent autonomously resolved 9 of 353 open Erdős problems.
        note_zh: 一个智能体自主解决了 353 个公开 Erdős 问题中的 9 个。
      - title: "Erdős Problem #728"
        url: https://arxiv.org/abs/2601.07421
        kinds: [Demo]
        date: "2026-01"
        note: The first Erdős problem recognised as solved autonomously by AI.
        note_zh: 第一个被公认由 AI 自主解决的 Erdős 问题。

  - id: "004"
    slug: exam
    name: The Exam
    name_zh: 考试
    since_year: 605
    since: "605"
    origin: "with the imperial examinations of the Sui dynasty"
    origin_zh: "随隋代科举而生"
    status: declared
    by: Humanity’s Last Exam · The Last Math Competition
    by_zh: Humanity’s Last Exam · The Last Math Competition
    successor: Open problems as the benchmark
    successor_zh: 以未解难题为基准
    epitaph: Set by humans, to be the last thing machines could not pass.
    epitaph_zh: 由人类出题，本该是机器最后过不去的一关。
    entries:
      - title: The Last Math Competition
        url: https://github.com/The-Last-Math-Competition/The-Last-Math-Competition
        kinds: [Manifesto, Demo]
        date: "2026"
        note: “Possibly the last mathematics competition humanity will ever hold”. 10,000 conjectures; every solution is a pull request with LaTeX and a sorry-free Lean 4 project. 1,071 solved as of 2026-11.
        note_zh: “也许是人类举办的最后一场数学竞赛”。10,000 个猜想，每份解答都是附带 LaTeX 和无 sorry 的 Lean 4 项目的 PR；截至 2026-11 已解决 1,071 个。
      - title: Humanity’s Last Exam
        url: https://arxiv.org/abs/2501.14249
        kinds: [Manifesto]
        date: "2025-01"
        note: The precursor of the naming pattern. Expert-written questions positioned as the final closed-ended academic exam for AI.
        note_zh: 这一命名方式的先驱：由专家出题，定位为 AI 的最后一场封闭式学术考试。
        links: {site: https://lastexam.ai, x: https://x.com/danhendrycks/status/1882433928407241155}

