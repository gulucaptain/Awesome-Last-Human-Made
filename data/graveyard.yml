        kinds: [Demo]
        date: "2025-03"
        note: For a month, an Italian daily shipped a four-page insert written entirely by AI — articles, headlines, quotes, summaries, even letters to the editor. Journalists wrote only the prompts.
        note_zh: 一家意大利日报连续一个月随报附送四版完全由 AI 写成的增刊，文章、标题、引语、摘要乃至读者来信都由 AI 完成，记者只负责写提示词。

