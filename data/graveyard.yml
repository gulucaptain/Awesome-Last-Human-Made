    successor_zh: 智能体，外加一个仍要签字的人
    epitaph: Typed one character at a time, for seventy years.
    epitaph_zh: 七十年来，一个字符一个字符地敲出来。
    entries:
      - title: Last Human Commit
        url: https://github.com/megamen32/LastHumanCommit
        kinds: [Demo]
        date: "2026"
        note: An automatic engineering workflow that takes a rough request, even a voice transcript, all the way to a tested, merged change.
        note_zh: 自动化工程流程：从一句粗糙的需求（甚至语音转写）一路做到测试通过并合并的改动。
      - title: The Last Harness
        url: https://github.com/diegopetrucci/the-last-harness
        kinds: [Manifesto]
        date: "2026"
        note: “The last harness you’ll ever need”, built on one line — you can outsource your thinking, but not your understanding.
        note_zh: “你需要的最后一个 harness”，核心信条是：思考可以外包，理解不能。
      - title: The Last Human
        url: https://github.com/microsoft-2026-hackathon/the-last-human
        kinds: [Counter]
        date: "2026"
        note: A human checkpoint. Before a risky agent-written PR merges, its author must explain the change from the code.
        note_zh: 一道人工关卡：高风险的智能体 PR 合并前，作者必须对照代码讲清楚这次改动。

